<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>系统状态 · logo23007 后台</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    @media (max-width: 639px) {
      .grid.cols-4.stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stats .card { padding: 16px; }
      .stats .num { font-size: 1.4rem; }
    }
    .stats { margin-bottom: 20px; }
    .stats .card { margin-bottom: 0; border-radius: 16px; }
    .stats .sub { margin-top: 4px; font-size: .8rem; }
    .bar-track {
      margin-top: 10px; height: 6px; border-radius: 999px; overflow: hidden;
      background: rgba(15, 23, 42, .08);
    }
    @media (prefers-color-scheme: dark) {
      .bar-track { background: rgba(148, 163, 184, .16); }
    }
    .bar-fill {
      height: 100%; width: 0; border-radius: 999px;
      background: var(--accent); transition: width .4s ease-in-out;
    }
    select {
      padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--input); color: var(--text); font: inherit;
      transition: all .3s ease-in-out; cursor: pointer;
    }
    select:hover { border-color: var(--muted); }
    select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav id="nav" class="nav"></nav>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>系统状态</h2>
          <span id="lastUpdated" class="muted"></span>
        </div>
        <div class="row">
          <label for="refreshInterval" class="muted" style="margin:0">刷新间隔</label>
          <select id="refreshInterval">
            <option value="5" selected>5秒</option>
            <option value="10">10秒</option>
            <option value="30">30秒</option>
          </select>
          <button id="btnRefresh" class="secondary" type="button">立即刷新</button>
        </div>
      </div>

      <div class="grid cols-4 stats">
        <div class="card stat">
          <div class="muted">CPU 使用率</div>
          <div id="cpuNum" class="num">—</div>
          <div class="bar-track"><div id="cpuBar" class="bar-fill"></div></div>
        </div>
        <div class="card stat">
          <div class="muted">内存使用率</div>
          <div id="memNum" class="num">—</div>
          <div id="memSub" class="muted sub">—</div>
          <div class="bar-track"><div id="memBar" class="bar-fill"></div></div>
        </div>
        <div class="card stat">
          <div class="muted">磁盘读取</div>
          <div id="diskReadNum" class="num">—</div>
        </div>
        <div class="card stat">
          <div class="muted">磁盘写入</div>
          <div id="diskWriteNum" class="num">—</div>
        </div>
      </div>

      <div class="grid cols-4 stats" style="margin-bottom:0">
        <div class="card stat">
          <div class="muted">磁盘占用</div>
          <div id="diskPctNum" class="num">—</div>
          <div id="diskSub" class="muted sub">—</div>
          <div class="bar-track"><div id="diskBar" class="bar-fill"></div></div>
        </div>
        <div class="card stat">
          <div class="muted">负载 (1 / 5 / 15)</div>
          <div id="loadNum" class="num" style="font-size:1.35rem">—</div>
        </div>
        <div class="card stat">
          <div class="muted">运行时间</div>
          <div id="uptimeNum" class="num" style="font-size:1.35rem">—</div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    const LS_KEY = 'logo23007_sys_refresh_sec';
    let timer = null;
    let loading = false;
    let lastErr = '';

    function isMissing(v) {
      return v == null || v === '' || (typeof v === 'number' && (!Number.isFinite(v) || v < 0));
    }

    function fmtGiB(bytes) {
      const v = Number(bytes);
      if (!Number.isFinite(v) || v < 0) return '—';
      const gib = v / (1024 * 1024 * 1024);
      return (gib >= 100 ? gib.toFixed(1) : gib.toFixed(2)) + ' GiB';
    }

    function fmtPct(n) {
      if (isMissing(n)) return '采样中…';
      return Number(n).toFixed(1) + '%';
    }

    function fmtMBps(bps) {
      if (isMissing(bps)) return '采样中…';
      return (Number(bps) / 1e6).toFixed(2) + ' MB/s';
    }

    function fmtUptime(sec) {
      if (isMissing(sec)) return '—';
      let s = Math.floor(Number(sec));
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60); s %= 60;
      const parts = [];
      if (d) parts.push(d + ' 天');
      if (h || d) parts.push(h + ' 小时');
      if (m || h || d) parts.push(m + ' 分');
      parts.push(s + ' 秒');
      return parts.join(' ');
    }

    function setBar(el, pct) {
      if (isMissing(pct)) { el.style.width = '0%'; return; }
      const v = Math.max(0, Math.min(100, Number(pct)));
      el.style.width = v.toFixed(1) + '%';
    }

    function render(stats) {
      const s = stats || {};

      $('cpuNum').textContent = fmtPct(s.cpu_percent);
      setBar($('cpuBar'), s.cpu_percent);

      $('memNum').textContent = fmtPct(s.mem_percent);
      $('memSub').textContent = isMissing(s.mem_used_bytes) || isMissing(s.mem_total_bytes)
        ? '—'
        : fmtGiB(s.mem_used_bytes) + ' / ' + fmtGiB(s.mem_total_bytes);
      setBar($('memBar'), s.mem_percent);

      $('diskReadNum').textContent = fmtMBps(s.disk_read_bps);
      $('diskWriteNum').textContent = fmtMBps(s.disk_write_bps);

      $('diskPctNum').textContent = fmtPct(s.disk_percent);
      $('diskSub').textContent = isMissing(s.disk_used_bytes) || isMissing(s.disk_total_bytes)
        ? '—'
        : fmtGiB(s.disk_used_bytes) + ' / ' + fmtGiB(s.disk_total_bytes);
      setBar($('diskBar'), s.disk_percent);

      if (isMissing(s.load1) && isMissing(s.load5) && isMissing(s.load15)) {
        $('loadNum').textContent = '—';
      } else {
        $('loadNum').textContent =
          Number(s.load1 || 0).toFixed(2) + ' / ' +
          Number(s.load5 || 0).toFixed(2) + ' / ' +
          Number(s.load15 || 0).toFixed(2);
      }

      $('uptimeNum').textContent = fmtUptime(s.uptime_sec);
      $('lastUpdated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }

    async function load() {
      if (loading) return;
      loading = true;
      try {
        const data = await api('GET', '/api/system/stats');
        render(data.stats || {});
        lastErr = '';
      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        if (msg !== lastErr) toast(msg, false);
        lastErr = msg;
      } finally {
        loading = false;
      }
    }

    function readInterval() {
      const v = parseInt($('refreshInterval').value, 10);
      return [5, 10, 30].includes(v) ? v : 5;
    }

    function schedule() {
      if (timer) { clearInterval(timer); timer = null; }
      const sec = readInterval();
      localStorage.setItem(LS_KEY, String(sec));
      timer = setInterval(() => {
        if (document.hidden) return;
        load();
      }, sec * 1000);
    }

    $('btnRefresh').onclick = () => load();
    $('refreshInterval').onchange = () => {
      schedule();
      load();
    };

    (function initInterval() {
      const saved = parseInt(localStorage.getItem(LS_KEY), 10);
      if ([5, 10, 30].includes(saved)) $('refreshInterval').value = String(saved);
    })();

    (async () => {
      if (await requireAuth()) {
        renderNav('system.html');
        schedule();
        load();
      }
    })();
  </script>
</body>
</html>
