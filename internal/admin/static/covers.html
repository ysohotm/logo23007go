<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>关键词图片池 · logo23007 后台</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    input[type=number], textarea {
      width: 100%; max-width: 420px; padding: 10px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--input); color: var(--text);
      font: inherit; transition: all .3s ease-in-out;
    }
    input[type=number]:hover, textarea:hover { border-color: var(--accent); }
    textarea { min-height: 88px; resize: vertical; }
    .actions { margin-top: 20px; justify-content: flex-end; }
    .notes { margin: 16px 0 0; padding-left: 20px; }
    .kw-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .kw-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .kw-row:last-child { border-bottom: none; }
    .kw-text { font-weight: 500; min-width: 4em; }
    .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .kw-chip {
      font-size: .8rem; font-variant-numeric: tabular-nums;
      padding: 3px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--input);
    }
    .kw-chip.done { color: var(--muted); opacity: .85; }
    .kw-chip.todo { color: var(--text); font-weight: 600; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav id="nav" class="nav"></nav>

    <form id="form" class="card" style="max-width:640px" autocomplete="off">
      <h2>关键词图片池</h2>
      <p class="muted" style="margin:0 0 20px">仅对下方尺寸做预生成与随机返回；其它尺寸仍按请求实时生成。默认尺寸为 600×800。</p>
      <label for="count">每个关键词的图片数量</label>
      <input id="count" type="number" min="1" max="100" step="1" inputmode="numeric" required />
      <label for="sizes">启用预生成 / 随机的尺寸</label>
      <textarea id="sizes" placeholder="每行一个，例如&#10;600x800&#10;300x400" required></textarea>
      <div class="row actions">
        <button id="btnSave" type="submit">保存并生效</button>
      </div>
    </form>

    <div class="card" style="max-width:640px">
      <h2>手工添加关键词</h2>
      <p class="muted" style="margin:0 0 20px">固定输出 WebP；按上方已保存的尺寸白名单，为每个关键词后台补齐到配置数量。可多种尺寸。</p>
      <label for="keywords">关键词</label>
      <textarea id="keywords" placeholder="每行一个关键词"></textarea>
      <div class="row actions">
        <button id="btnGenerate" type="button">生成备用图片</button>
      </div>
    </div>

    <div class="card" style="max-width:640px">
      <h2>关键词进度</h2>
      <div class="row actions" style="margin-top:0; margin-bottom:12px; justify-content:flex-end">
        <button id="btnRefreshKeywords" type="button">刷新进度</button>
      </div>
      <div id="keywordList" class="kw-list"></div>
    </div>

    <div class="card" style="max-width:640px">
      <h2>使用说明</h2>
      <ul class="notes muted">
        <li>只有白名单尺寸会建池：首图立即返回，其余后台补齐后随机。</li>
        <li>未在列表中的尺寸不预生成、不随机，每次实时出图。</li>
        <li>减小数量或删掉某个尺寸，不删除已生成的历史文件。</li>
        <li>Cloudflare 缓存命中期间直接返回已缓存图片，不会重新随机。</li>
        <li>手工添加固定 WebP，尺寸以本页已保存白名单为准。</li>
      </ul>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    function fill(config) {
      $('count').value = config.count;
      $('sizes').value = (config.sizes || []).join('\n');
    }

    function parseSizes(text) {
      return String(text || '')
        .split(/[\n,]+/)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function parseKeywords(text) {
      return String(text || '')
        .split('\n')
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function load() {
      const data = await api('GET', '/api/cover-pool');
      fill(data.config);
    }

    async function loadKeywords() {
      const list = $('keywordList');
      try {
        const data = await api('GET', '/api/cover-pool/keywords');
        const keywords = data.keywords || [];
        if (!keywords.length) {
          list.innerHTML = '<p class="muted" style="margin:0">暂无登记关键词</p>';
          return;
        }
        list.innerHTML = keywords.map((kw) => {
          const chips = (kw.sizes || []).map((sz) => {
            const done = (sz.count || 0) >= (sz.target || 0);
            const cls = done ? 'kw-chip done' : 'kw-chip todo';
            return `<span class="${cls}">${sz.w}×${sz.h} ${sz.count || 0}/${sz.target || 0}</span>`;
          }).join('');
          return `<div class="kw-row"><span class="kw-text">${escapeHtml(kw.text || '')}</span><span class="kw-chips">${chips}</span></div>`;
        }).join('');
      } catch (err) {
        toast(err.message, false);
      }
    }

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const count = Number($('count').value);
      const sizes = parseSizes($('sizes').value);
      if (!Number.isInteger(count) || count < 1 || count > 100) {
        toast('每个关键词的图片数量需为 1–100 的整数', false);
        return;
      }
      if (!sizes.length) {
        toast('请至少填写一个尺寸，例如 600x800', false);
        return;
      }
      $('btnSave').disabled = true;
      try {
        const data = await api('PUT', '/api/cover-pool', { count, sizes });
        fill(data.config);
        toast('已保存并生效', true);
      } catch (err) {
        toast(err.message, false);
      } finally {
        $('btnSave').disabled = false;
      }
    };

    $('btnGenerate').onclick = async () => {
      const keywords = parseKeywords($('keywords').value);
      if (!keywords.length) {
        toast('请至少填写一个关键词', false);
        return;
      }
      $('btnGenerate').disabled = true;
      try {
        const data = await api('POST', '/api/cover-pool/generate', { keywords });
        const r = data.result || {};
        toast(`已入队 ${r.accepted || 0}，跳过 ${r.skipped || 0}，失败 ${r.failed || 0}`, true);
        loadKeywords();
      } catch (err) {
        toast(err.message, false);
      } finally {
        $('btnGenerate').disabled = false;
      }
    };

    $('btnRefreshKeywords').onclick = () => {
      loadKeywords().catch((e) => toast(e.message, false));
    };

    if (requireToken()) {
      renderNav('covers.html');
      load().catch(e => toast(e.message, false));
      loadKeywords().catch(e => toast(e.message, false));
    }
  </script>
</body>
</html>
