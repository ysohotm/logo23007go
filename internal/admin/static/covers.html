<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>关键词图片池 · logo23007 后台</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    input[type=number] {
      width: 160px; padding: 10px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--input); color: var(--text);
      font: inherit; transition: all .3s ease-in-out;
    }
    input[type=number]:hover { border-color: var(--accent); }
    .actions { margin-top: 20px; justify-content: flex-end; }
    .notes { margin: 16px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav id="nav" class="nav"></nav>

    <form id="form" class="card" style="max-width:640px" autocomplete="off">
      <h2>关键词图片池</h2>
      <p class="muted" style="margin:0 0 20px">设置每个关键词随机使用的图片数量，默认 10 张，可设置为 1–100 张；保存后立即生效。</p>
      <label for="count">每个关键词的图片数量</label>
      <input id="count" type="number" min="1" max="100" step="1" inputmode="numeric" required />
      <div class="row actions">
        <button id="btnSave" type="submit">保存并生效</button>
      </div>
    </form>

    <div class="card" style="max-width:640px">
      <h2>使用说明</h2>
      <ul class="notes muted">
        <li>首图立即返回，其余图片由后台补齐。</li>
        <li>减小数量只影响后续随机范围，不删除已生成的历史图片。</li>
        <li>Cloudflare 缓存命中期间直接返回已缓存图片，不会重新随机。</li>
      </ul>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    function fill(config) {
      $('count').value = config.count;
    }

    async function load() {
      const data = await api('GET', '/api/cover-pool');
      fill(data.config);
    }

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const count = Number($('count').value);
      if (!Number.isInteger(count) || count < 1 || count > 100) {
        toast('每个关键词的图片数量需为 1–100 的整数', false);
        return;
      }
      $('btnSave').disabled = true;
      try {
        const data = await api('PUT', '/api/cover-pool', { count });
        fill(data.config);
        toast('已保存并生效', true);
      } catch (err) {
        toast(err.message, false);
      } finally {
        $('btnSave').disabled = false;
      }
    };

    if (requireToken()) {
      renderNav('covers.html');
      load().catch(e => toast(e.message, false));
    }
  </script>
</body>
</html>
