# 通用图床：xsimg.* / img.* / simg.* / dimg.* / ximg.* / 9simg.*
# 反代本机 logo23007go :23107
# CF Flexible → 80；Full/Strict 可另挂证书（本配置先开 80，覆盖绝大多数橙色云回源）
#
# 精确 server_name 的旧域配置优先级更高，可继续保留特殊跳转；
# 未单独声明的图床子域一律走本通配。

upstream logo23107 {
    server 127.0.0.1:23107;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<imgsub>xsimg|img|simg|dimg|ximg|9simg)\.(?<basedomain>.+)$;

    include /etc/nginx/snippets/block-bad-uri.conf;
    access_log /var/log/nginx/xsimg_access.log main;
    error_log  /var/log/nginx/xsimg_error.log;

    client_max_body_size 2m;
    keepalive_timeout 5s;
    keepalive_requests 100;
    reset_timedout_connection on;

    limit_conn img_all 400;
    limit_conn img_per_ip 20;
    limit_req zone=img_req_ip burst=60 nodelay;
    limit_conn_status 503;
    limit_req_status 503;

    # 兼容旧 avatar / vfile（若本机无则 502，不影响封面主路径）
    location /avatar/ {
        rewrite ^/avatar/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:24011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location /vfile/ {
        rewrite ^/vfile/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:24002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # /vod/xxx_300x400.jpg 以及 /uploads/...
    location ~ /(uploads|vod)/(.+)(\.jpg|_.*\.jpg)$ {
        set $def /home/image?text=$2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X_ORIGINAL_URL $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://logo23107$def;
    }

    location /upload/image/ {
        rewrite "^/upload/image/([A-Za-z0-9-]+)_(\d+)x(\d+)\.[A-Za-z]+$" /home/ImageKey?id=$1&width=$2&height=$3 break;
        rewrite "^/upload/image/([A-Za-z0-9-]+)\.[A-Za-z]+$" /home/ImageKey?id=$1 break;
        proxy_pass http://logo23107;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 直连 logo 常用路径（后台/调试）
    location ^~ /home/ {
        proxy_pass http://logo23107;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        proxy_pass http://logo23107;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /domain.txt {
        default_type text/plain;
        return 200 $basedomain;
    }

    location / {
        return 404;
    }
}
